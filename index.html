<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>MartiFront E-Commerce</title>
<link rel="icon" href="public/vite.png" type="image/png">
<style>
/* ---------- RESET & BODY ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background-color: #f2f5f9; color: #333; line-height: 1.5; }

/* ---------- HEADER ---------- */
header {
    background: linear-gradient(90deg, #1e3c72, #2a5298);
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
header h1 { font-size: 28px; letter-spacing: 1px; }
.header-btns { display: flex; gap: 10px; }

.cart-btn, .login-btn {
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease;
}
.cart-btn { background-color: #2ecc71; }
.cart-btn:hover { background-color: #27ae60; }

.login-btn { background-color: #f39c12; }
.login-btn:hover { background-color: #e67e22; }

/* ---------- MODAL LOGIN ---------- */
.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000;
    visibility: hidden; opacity: 0;
    transition: all 0.3s ease;
}
.modal-overlay.active { visibility: visible; opacity: 1; }

.login-form {
    background: white; padding: 30px; border-radius: 12px;
    width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    position: relative;
}
.login-form h2 { margin-bottom: 20px; color: #1e3c72; text-align: center; }
.login-form input {
    width: 100%; padding: 12px; margin-bottom: 15px;
    border: 1px solid #ccc; border-radius: 6px;
}
.login-form button {
    width: 100%; padding: 12px; background: #1e3c72;
    color: white; border: none; border-radius: 6px; cursor: pointer;
}
.close-modal {
    position: absolute; top: 10px; right: 15px;
    font-size: 20px; cursor: pointer; color: #999;
}

/* ---------- CART ---------- */
.cart {
    position: fixed; top: 90px; right: 20px; width: 350px;
    background-color: white; border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 20px;
    transition: transform 0.4s ease, opacity 0.4s ease; z-index: 100;
}
.cart.folded { transform: translateX(400px); opacity: 0; }
.cart.unfolded { transform: translateX(0); opacity: 1; }
.cart h2 { margin-bottom: 15px; color: #2a5298; }
.cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
.cart-item button { background-color: #e74c3c; border: none; color: white; border-radius: 4px; padding: 5px 10px; cursor: pointer; transition: background 0.3s ease; }
.cart-item button:hover { background-color: #c0392b; }

/* ---------- STORE ---------- */
.store {
    max-width: 1200px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    padding: 0 20px;
}
.product {
    background-color: white;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.product:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.15);
}
.product img {
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    margin-bottom: 15px;
}
.product h3 { margin-bottom: 10px; font-size: 20px; color: #1e3c72; }
.product p { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #2a5298; }
.product button {
    background-color: #2a5298;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: background-color 0.3s ease;
}
.product button:hover { background-color: #1e3c72; }

/* ---------- POPUP ---------- */
.popup {
    position: fixed; bottom: 30px; right: 30px;
    background-color: #2ecc71;
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    font-size: 15px;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 200;
}
.popup.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }

/* ---------- FOOTER ---------- */
footer {
    background-color: #2a5298;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 50px;
}
</style>
</head>
<body>

<header>
    <h1>PRO FOOTBALL BOOTS</h1>
    <div class="header-btns">
        <button class="login-btn" onclick="toggleLoginModal()">👤 Iniciar sessió</button>
        <button class="cart-btn" onclick="toggleCart()">🛒 Cistella</button>
    </div>
</header>

<div id="loginModal" class="modal-overlay" onclick="toggleLoginModal()">
    <div class="login-form" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="toggleLoginModal()">&times;</span>
        <h2>Iniciar sessió</h2>
        <form id="formLogin">
            <input type="email" placeholder="Correu electrònic" required>
            <input type="password" placeholder="Contrasenya" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</div>

<div id="popup" class="popup hidden">El producte s'ha afegit correctament a la cistella</div>

<div id="cart" class="cart folded">
    <h2>La teva cistella</h2>
    <div id="cartItems"><p>Cistella buida</p></div>
</div>

<main class="store">
    <div class="product">
        <img src="./public/bota1.jpg" alt="Bota 1">
        <h3>Adidas Predator</h3>
        <p>120 €</p>
        <button onclick="addToCart({nom:'Adidas Predator', preu:120, imatge:'./public/bota1.jpg'})">Afegir a la cistella</button>
    </div>
    <div class="product">
        <img src="./public/botas2.jpg" alt="Bota 2">
        <h3>Nike Mercurial</h3>
        <p>130 €</p>
        <button onclick="addToCart({nom:'Nike Mercurial', preu:130, imatge:'./public/botas2.jpg'})">Afegir a la cistella</button>
    </div>
    <div class="product">
        <img src="./public/botas3.png" alt="Bota 3">
        <h3>Puma Future</h3>
        <p>110 €</p>
        <button onclick="addToCart({nom:'Puma Future', preu:110, imatge:'./public/botas3.png'})">Afegir a la cistella</button>
    </div>
</main>

<footer>
    <p>© 2026 Pro Football Boots - Botiga professional</p>
</footer>

<script>
let cartItems = [];

// Funciones para el Modal de Login
function toggleLoginModal() {
    const modal = document.getElementById("loginModal");
    modal.classList.toggle("active");
}

document.getElementById("formLogin").addEventListener("submit", (e) => {
    e.preventDefault();
    showPopup("Sessió iniciada correctament");
    toggleLoginModal();
});

function toggleCart() {
    const cart = document.getElementById("cart");
    cart.classList.toggle("folded");
    cart.classList.toggle("unfolded");
}

function showPopup(message = "El producte s'ha afegit correctament a la cistella") {
    const popup = document.getElementById("popup");
    popup.textContent = message;
    popup.classList.remove("hidden");
    setTimeout(() => popup.classList.add("hidden"), 2000);
}

function renderCart() {
    const container = document.getElementById("cartItems");
    container.innerHTML = "";
    if(cartItems.length === 0) { 
        container.innerHTML = "<p>Cistella buida</p>"; 
        return; 
    }
    cartItems.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
            <span>${item.nom} - ${item.preu}€</span>
            <button onclick="removeFromCart(${index})">❌</button>
        `;
        container.appendChild(div);
    });
}

async function addToCart(product) {
    cartItems.push(product);
    renderCart();
    showPopup("Producte afegit a la cistella correctament");

    try {
        await fetch("http://127.0.0.1:3000/cart", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(product)
        });
    } catch (e) {
        console.log("Backend no disponible");
    }
}

function removeFromCart(index) {
    cartItems.splice(index, 1);
    renderCart();
    showPopup("Producte eliminat de la cistella");
}
</script>

</body>
</html>
